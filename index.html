<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HE SMART SCANNER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #12141c; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 15px;
        }
        h2 { margin: 10px 0 10px; font-size: 1.4rem; text-align: center; }
        
        #reader { 
            width: 100%; 
            max-width: 500px; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        
        .data-card {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            padding: 15px;
            background: #1e2230;
            border-radius: 12px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #2d3345;
        }
        .data-row:last-child { border-bottom: none; }
        .label { font-size: 0.9rem; color: #a0a5b5; }
        .val { font-size: 1rem; font-weight: bold; color: #4CAF50; word-break: break-all; }
        
        .status-msg {
            margin-top: 10px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .btn-action {
            margin-top: 12px;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
        }
        .btn-reset { background-color: #4b5563; margin-top: 8px; }
    </style>
</head>
<body>

    <h2>HE SMART SCANNER</h2>
    
    <div id="reader"></div>

    <div class="data-card">
        <div class="data-row">
            <span class="label">1. ใบงาน (x_name):</span>
            <span id="val-scan-input" class="val">รอสแกน...</span>
        </div>
        <div class="data-row">
            <span class="label">2. Locator (x_studio...):</span>
            <span id="val-locator" class="val">รอสแกน...</span>
        </div>
    </div>

    <div id="status-text" class="status-msg" style="color: #eab308;">📌 กรุณาสแกน "ใบงานพาเลท"</div>

    <button id="reset-btn" class="btn-action btn-reset" onclick="resetAll()">🔄 เริ่มใหม่ / ล้างข้อมูล</button>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let html5Qrcode;
        let scanInputVal = "";
        let locatorCodeVal = "";
        let currentStep = 1; // 1 = Scan Input, 2 = Locator Code

        const odooWebhookUrl = "https://he-smart.odoo.com/web/hook/5bD59400-2426-4406-b636-fb3e9f3349a0"; 

        function initScanner() {
            html5Qrcode = new Html5Qrcode("reader");
            startScanner();
        }

        function startScanner() {
            html5Qrcode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                document.getElementById('status-text').innerText = '❌ ไม่สามารถเปิดกล้องได้';
                document.getElementById('status-text').style.color = '#ff4d4d';
            });
        }

        function onScanSuccess(decodedText) {
            if (currentStep === 1) {
                scanInputVal = decodedText;
                document.getElementById('val-scan-input').innerText = scanInputVal;
                currentStep = 2;
                
                document.getElementById('status-text').innerText = '📌 สแกนใบงานสำเร็จ! ถัดไปสแกน "Locator Code"';
                document.getElementById('status-text').style.color = '#eab308';
                
            } else if (currentStep === 2) {
                locatorCodeVal = decodedText;
                document.getElementById('val-locator').innerText = locatorCodeVal;
                
                // หยุดกล้องเพื่อส่งข้อมูล
                html5Qrcode.stop().then(() => {
                    sendToOdoo();
                });
            }
        }

        function sendToOdoo() {
            document.getElementById('status-text').innerText = '⏳ กำลังส่งข้อมูลเข้า Odoo...';
            document.getElementById('status-text').style.color = '#eab308';

            fetch(odooWebhookUrl, {
                method: 'POST',
                mode: 'no-cors', // ป้องกันการบล็อก CORS ของ Odoo Webhook
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    scan_input: scanInputVal,
                    locator_code: locatorCodeVal 
                })
            })
            .then(() => {
                document.getElementById('status-text').innerText = '✅ บันทึกเข้า Odoo เรียบร้อย!';
                document.getElementById('status-text').style.color = '#4CAF50';
                
                // รอ 2 วินาทีแล้วเริ่มสแกนชุดใหม่
                setTimeout(() => { resetAll(); }, 2000);
            })
            .catch(error => {
                document.getElementById('status-text').innerText = '❌ เกิดข้อผิดพลาด';
                document.getElementById('status-text').style.color = '#ff4d4d';
            });
        }

        function resetAll() {
            scanInputVal = "";
            locatorCodeVal = "";
            currentStep = 1;
            document.getElementById('val-scan-input').innerText = 'รอสแกน...';
            document.getElementById('val-locator').innerText = 'รอสแกน...';
            document.getElementById('status-text').innerText = '📌 กรุณาสแกน "ใบงานพาเลท"';
            document.getElementById('status-text').style.color = '#eab308';
            
            if (!html5Qrcode.isScanning) {
                startScanner();
            }
        }

        function onScanFailure(error) {}

        window.onload = initScanner;
    </script>
</body>
</html>
