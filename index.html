<body>
    <div style="padding: 20px; color: white; text-align: center;">
        <h2>สแกน QR Code ใบงาน</h2>
        
        <!-- กล่องสำหรับเปิดกล้อง -->
        <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto; background: white; color: black;"></div>
        
        <!-- แสดงผลข้อความที่สแกนได้ -->
        <h3 style="margin-top: 20px;">ผลการสแกน: <span id="scan-result" style="color: #4CAF50;">ยังไม่มีข้อมูล</span></h3>
    </div>

    <!-- โหลด Library สำหรับสแกน QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        // ฟังก์ชันเมื่อสแกน QR Code สำเร็จ
        function onScanSuccess(decodedText, decodedResult) {
            // นำข้อความที่สแกนได้มาแสดงบนหน้าจอ
            document.getElementById('scan-result').innerText = decodedText;
            
            // แจ้งเตือนเพื่อให้รู้ว่าสแกนติดแล้ว
            alert("สแกนได้ข้อความ: " + decodedText);

            // หยุดกล้องเพื่อป้องกันการสแกนซ้ำรัวๆ
            html5QrcodeScanner.clear();

            // ----------------------------------------------------
            // (เดี๋ยวเราจะเอาโค้ดส่งข้อมูลไป Odoo มาใส่ตรงนี้ในขั้นตอนหน้า)
            // ----------------------------------------------------
        }

        // ฟังก์ชันเมื่อสแกนไม่เจอ (ให้ปล่อยว่างไว้)
        function onScanFailure(error) {
            // ไม่ต้องทำอะไร
        }

        // ตั้งค่ากล้อง
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: {width: 250, height: 250} },
            false);
        
        // สั่งให้กล้องเริ่มทำงาน
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>ฆ
