<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HE SMART SCANNER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #12141c; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 15px;
        }
        h2 { margin: 10px 0 15px; font-size: 1.5rem; text-align: center; }
        
        /* กล่องแสดงผลกล้องขนาดใหญ่ */
        #reader { 
            width: 100%; 
            max-width: 500px; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        
        /* กล่องแสดงผลข้อความ */
        .result-box {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            padding: 18px;
            background: #1e2230;
            border-radius: 12px;
            text-align: center;
        }
        .result-title { font-size: 0.95rem; color: #a0a5b5; }
        .result-text {
            font-size: 1.25rem;
            font-weight: bold;
            color: #4CAF50;
            word-break: break-all;
            margin-top: 8px;
            white-space: pre-line;
        }
        
        /* ปุ่มสแกนอีกครั้ง */
        .btn-rescan {
            margin-top: 15px;
            padding: 15px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
            display: none;
        }
        .btn-rescan:active { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <h2>HE SMART SCANNER</h2>
    
    <!-- ช่องมองกล้อง -->
    <div id="reader"></div>

    <!-- ผลการสแกน -->
    <div class="result-box">
        <div class="result-title">สถานะการทำงาน</div>
        <div id="scan-result" class="result-text">กำลังเตรียมเปิดกล้อง...</div>
    </div>

    <!-- ปุ่มกดสแกนใหม่ -->
    <button id="rescan-btn" class="btn-rescan" onclick="startScanner()">📷 สแกนอีกครั้ง</button>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let html5Qrcode;

        // ⚠️ วาง URL Secret จาก Odoo ของคุณในเครื่องหมายอัญประกาศด้านล่างนี้
        const odooWebhookUrl = "https://he-smart.odoo.com/web/hook/5bd59400-2426-4406-b636-fb3e9f3349a0"; 

        function initScanner() {
            html5Qrcode = new Html5Qrcode("reader");
            startScanner();
        }

        function startScanner() {
            document.getElementById('rescan-btn').style.display = 'none';
            document.getElementById('scan-result').innerText = 'สแกน QR Code ใบงาน...';
            document.getElementById('scan-result').style.color = '#4CAF50';

            // เปิดกล้องหลังอัตโนมัติ
            html5Qrcode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                document.getElementById('scan-result').innerText = 'ไม่สามารถเปิดกล้องหลังได้';
                document.getElementById('scan-result').style.color = '#ff4d4d';
            });
        }

        function onScanSuccess(decodedText) {
            // 1. แจ้งสถานะกำลังส่ง
            document.getElementById('scan-result').innerText = 'กำลังส่งไป Odoo...\n' + decodedText;
            document.getElementById('scan-result').style.color = '#eab308';

            // 2. หยุดกล้องและแสดงปุ่มสแกนใหม่
            html5Qrcode.stop().then(() => {
                document.getElementById('rescan-btn').style.display = 'block';
            });

            // 3. ยิงข้อมูลเข้า Odoo Webhook
            fetch(odooWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_code: decodedText })
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('scan-result').innerText = '✅ บันทึก Odoo สำเร็จ!\n' + decodedText;
                    document.getElementById('scan-result').style.color = '#4CAF50';
                } else {
                    throw new Error('Response not OK');
                }
            })
            .catch(error => {
                document.getElementById('scan-result').innerText = '❌ ส่งเข้า Odoo ไม่สำเร็จ';
                document.getElementById('scan-result').style.color = '#ff4d4d';
            });
        }

        function onScanFailure(error) {
            // ปล่อยว่างไว้ขณะกำลังสแกน
        }

        window.onload = initScanner;
    </script>
</body>
</html>
