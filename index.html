<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#12141c">

    <title>HE SMART SCANNER</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            padding:
                max(15px, env(safe-area-inset-top))
                15px
                max(24px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            align-items: center;

            background-color: #12141c;
            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .page-container {
            width: 100%;
            max-width: 520px;
        }

        .app-title {
            margin: 8px 0 5px;

            color: #ffffff;

            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-align: center;
        }

        .mode-badge {
            width: fit-content;

            margin: 8px auto 15px;
            padding: 7px 14px;

            border: 1px solid #3b82f6;
            border-radius: 999px;

            background-color: #172554;
            color: #93c5fd;

            font-size: 0.88rem;
            font-weight: 800;
            text-align: center;
        }

        .mode-badge.locator-mode {
            border-color: #f97316;
            background-color: #431407;
            color: #fdba74;
        }

        .instruction-card {
            width: 100%;

            margin-bottom: 14px;
            padding: 14px;

            border: 1px solid #364153;
            border-radius: 12px;

            background-color: #1e2230;

            text-align: center;
        }

        .instruction-title {
            margin-bottom: 5px;

            color: #ffffff;

            font-size: 1.05rem;
            font-weight: 800;
        }

        .instruction-text {
            color: #aab2c5;

            font-size: 0.9rem;
            line-height: 1.5;
        }

        #reader {
            width: 100%;
            min-height: 320px;

            overflow: hidden;

            border: 1px solid #364153;
            border-radius: 16px;

            background-color: #000000;

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        #reader video {
            object-fit: cover;
        }

        .data-card {
            width: 100%;

            margin-top: 15px;
            padding: 15px;

            border: 1px solid #364153;
            border-radius: 12px;

            background-color: #1e2230;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;

            padding: 11px 0;

            border-bottom: 1px solid #2d3345;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .label {
            flex: 0 0 38%;

            color: #a0a5b5;

            font-size: 0.86rem;
            line-height: 1.45;
        }

        .value {
            flex: 1;

            color: #4ade80;

            font-size: 0.94rem;
            font-weight: 800;
            line-height: 1.45;
            text-align: right;

            word-break: break-word;
        }

        .value.waiting {
            color: #facc15;
        }

        .value.error {
            color: #f87171;
        }

        .status-message {
            width: 100%;

            margin-top: 14px;
            padding: 14px;

            border: 1px solid #eab308;
            border-radius: 11px;

            background-color: #493d0b;
            color: #fde68a;

            font-size: 1rem;
            font-weight: 800;
            line-height: 1.5;
            text-align: center;
        }

        .status-message.processing {
            border-color: #38bdf8;
            background-color: #12304a;
            color: #7dd3fc;
        }

        .status-message.success {
            border-color: #22c55e;
            background-color: #163d2b;
            color: #86efac;
        }

        .status-message.error {
            border-color: #ef4444;
            background-color: #4a1717;
            color: #fca5a5;
        }

        .button {
            width: 100%;
            min-height: 56px;

            margin-top: 12px;
            padding: 14px;

            border: none;
            border-radius: 11px;

            color: #ffffff;

            cursor: pointer;

            font-size: 1.02rem;
            font-weight: 800;

            transition:
                opacity 0.2s ease,
                transform 0.1s ease,
                background-color 0.2s ease;
        }

        .button:active {
            transform: scale(0.99);
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .button-primary {
            background-color: #2563eb;
        }

        .button-primary:active {
            background-color: #1d4ed8;
        }

        .button-secondary {
            margin-top: 8px;
            background-color: #4b5563;
        }

        .button-secondary:active {
            background-color: #374151;
        }

        .hidden {
            display: none !important;
        }

        .technical-info {
            width: 100%;

            margin-top: 14px;
            padding: 13px;

            border: 1px dashed #475569;
            border-radius: 11px;

            background-color: #171b26;
        }

        .technical-title {
            margin-bottom: 7px;

            color: #cbd5e1;

            font-size: 0.8rem;
            font-weight: 800;
        }

        .technical-line {
            margin: 4px 0;

            color: #94a3b8;

            font-size: 0.76rem;
            line-height: 1.45;

            word-break: break-all;
        }

        @media (max-width: 390px) {
            body {
                padding-left: 10px;
                padding-right: 10px;
            }

            .app-title {
                font-size: 1.4rem;
            }

            .data-card {
                padding: 12px;
            }

            .label {
                flex-basis: 42%;
            }

            .button {
                min-height: 58px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <h1 class="app-title">
            HE SMART SCANNER
        </h1>

        <div id="mode-badge" class="mode-badge">
            กำลังตรวจสอบประเภทการสแกน
        </div>

        <section class="instruction-card">

            <div
                id="instruction-title"
                class="instruction-title"
            >
                กำลังเตรียม Scanner
            </div>

            <div
                id="instruction-text"
                class="instruction-text"
            >
                กรุณารอสักครู่
            </div>

        </section>

        <div id="reader"></div>

        <section class="data-card">

            <div class="data-row">

                <span class="label">
                    Target Field
                </span>

                <span
                    id="target-field-value"
                    class="value waiting"
                >
                    กำลังตรวจสอบ...
                </span>

            </div>

            <div class="data-row">

                <span class="label">
                    Scanned Value
                </span>

                <span
                    id="scanned-value"
                    class="value waiting"
                >
                    รอสแกน...
                </span>

            </div>

            <div class="data-row">

                <span class="label">
                    Odoo Record ID
                </span>

                <span
                    id="record-id-value"
                    class="value waiting"
                >
                    กำลังตรวจสอบ...
                </span>

            </div>

        </section>

        <div
            id="status-text"
            class="status-message"
        >
            กำลังเตรียมกล้อง
        </div>

        <!-- แสดงเฉพาะกรณีส่ง Webhook ไม่สำเร็จ -->
        <button
            id="scan-again-button"
            type="button"
            class="button button-primary hidden"
        >
            สแกนใหม่
        </button>

        <!-- ปุ่มกลับ Odoo กรณีส่งไม่สำเร็จหรือผู้ใช้ต้องการออก -->
        <button
            id="close-button"
            type="button"
            class="button button-secondary hidden"
        >
            กลับไปยัง Odoo
        </button>

        <!-- แสดงช่วงเริ่มต้นหรือเมื่อเปิดกล้องไม่สำเร็จ -->
        <button
            id="reset-button"
            type="button"
            class="button button-secondary"
        >
            เริ่มกล้องใหม่
        </button>

        <section class="technical-info">

            <div class="technical-title">
                Technical Information
            </div>

            <div
                id="technical-target"
                class="technical-line"
            ></div>

            <div
                id="technical-field"
                class="technical-line"
            ></div>

            <div
                id="technical-model"
                class="technical-line"
            ></div>

            <div
                id="technical-record"
                class="technical-line"
            ></div>

        </section>

    </main>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        "use strict";

        /*
         * =====================================================
         * CONFIGURATION
         * =====================================================
         */

        /*
         * สำคัญ:
         * กด Renew Secret ใน Odoo ก่อน แล้วนำ URL ใหม่มาใส่
         * ห้ามใส่ <a href=""> หรือ HTML tag รอบ URL
         */
        const ODOO_WEBHOOK_URL =
            "https://he-smart.odoo.com/web/hook/602572a5-f15e-444c-93ca-761ed7a35e85";

        const ODOO_BASE_URL =
            "https://he-smart.odoo.com";

        /*
         * Action ID ของ HE Inventory
         * จาก URL ปัจจุบันคือ action-236
         */
        const ODOO_ACTION_ID =
            "236";

        /*
         * หน่วงเวลาเพื่อให้ Webhook และ Automation ทำงานเสร็จ
         * 3000 = 3 วินาที
         */
        const WEBHOOK_WAIT_TIME_MS =
            3000;

        const ALLOWED_TARGETS = [
            "material",
            "locator"
        ];

        /*
         * =====================================================
         * TARGET MAPPING
         * =====================================================
         */

        const TARGET_CONFIG = {
            material: {
                pageTitle:
                    "SCAN MATERIAL QR",

                badgeText:
                    "MATERIAL QR MODE",

                instructionTitle:
                    "สแกนใบงานพาเลท",

                instructionText:
                    "จัด QR ใบงานพาเลทให้อยู่ในกรอบ ระบบจะบันทึกข้อมูลและกลับ Odoo อัตโนมัติ",

                targetField:
                    "x_name",

                sendingText:
                    "อ่าน Material QR สำเร็จ กำลังบันทึกเข้า Odoo",

                successText:
                    "ส่ง Material QR ไปยัง Odoo แล้ว",

                badgeClass:
                    ""
            },

            locator: {
                pageTitle:
                    "SCAN LOCATOR QR",

                badgeText:
                    "LOCATOR QR MODE",

                instructionTitle:
                    "สแกน Locator ตำแหน่งจัดเก็บ",

                instructionText:
                    "จัด QR Locator ให้อยู่ในกรอบ ระบบจะบันทึกตำแหน่งและกลับ Odoo อัตโนมัติ",

                targetField:
                    "x_studio_locator_code",

                sendingText:
                    "อ่าน Locator QR สำเร็จ กำลังบันทึกเข้า Odoo",

                successText:
                    "ส่ง Locator QR ไปยัง Odoo แล้ว",

                badgeClass:
                    "locator-mode"
            }
        };

        /*
         * =====================================================
         * URL PARAMETERS
         * =====================================================
         */

        const queryParameters =
            new URLSearchParams(
                window.location.search
            );

        const recordId =
            Number(
                queryParameters.get(
                    "record_id"
                )
            );

        const scanTarget =
            String(
                queryParameters.get(
                    "target"
                ) || ""
            )
                .trim()
                .toLowerCase();

        const modelName =
            String(
                queryParameters.get(
                    "model"
                ) ||
                "x_hex_inventory"
            ).trim();

        const targetConfiguration =
            TARGET_CONFIG[scanTarget] ||
            null;

        /*
         * =====================================================
         * APPLICATION STATE
         * =====================================================
         */

        let html5Qrcode = null;

        let scannedValue = "";

        let scanLocked = false;

        let scannerRunning = false;

        let submissionCompleted = false;

        let submissionInProgress = false;

        let countdownTimer = null;

        /*
         * =====================================================
         * DOM ELEMENTS
         * =====================================================
         */

        const modeBadge =
            document.getElementById(
                "mode-badge"
            );

        const instructionTitle =
            document.getElementById(
                "instruction-title"
            );

        const instructionText =
            document.getElementById(
                "instruction-text"
            );

        const targetFieldValue =
            document.getElementById(
                "target-field-value"
            );

        const scannedValueElement =
            document.getElementById(
                "scanned-value"
            );

        const recordIdValue =
            document.getElementById(
                "record-id-value"
            );

        const statusText =
            document.getElementById(
                "status-text"
            );

        const scanAgainButton =
            document.getElementById(
                "scan-again-button"
            );

        const closeButton =
            document.getElementById(
                "close-button"
            );

        const resetButton =
            document.getElementById(
                "reset-button"
            );

        const technicalTarget =
            document.getElementById(
                "technical-target"
            );

        const technicalField =
            document.getElementById(
                "technical-field"
            );

        const technicalModel =
            document.getElementById(
                "technical-model"
            );

        const technicalRecord =
            document.getElementById(
                "technical-record"
            );

        /*
         * =====================================================
         * PARAMETER VALIDATION
         * =====================================================
         */

        function validateParameters() {
            if (
                !Number.isInteger(recordId) ||
                recordId <= 0
            ) {
                showParameterError(
                    "ไม่พบ Record ID ที่ถูกต้อง",
                    "กรุณาเปิด Scanner จากปุ่มในรายการ HE Inventory"
                );

                return false;
            }

            if (
                !ALLOWED_TARGETS.includes(
                    scanTarget
                )
            ) {
                showParameterError(
                    "ไม่พบประเภทการสแกน",
                    "URL ต้องมี target=material หรือ target=locator"
                );

                return false;
            }

            if (
                modelName !==
                "x_hex_inventory"
            ) {
                showParameterError(
                    "ชื่อ Model ไม่ถูกต้อง",
                    "Model ต้องเป็น x_hex_inventory"
                );

                return false;
            }

            if (
                !ODOO_WEBHOOK_URL ||
                ODOO_WEBHOOK_URL.includes(
                    "PASTE_NEW_WEBHOOK"
                )
            ) {
                showParameterError(
                    "ยังไม่ได้ตั้งค่า Odoo Webhook",
                    "กรุณาใส่ Secret URL ใหม่ใน index.html"
                );

                return false;
            }

            return true;
        }

        function showParameterError(
            title,
            detail
        ) {
            modeBadge.textContent =
                "INVALID SCANNER CONFIGURATION";

            modeBadge.classList.add(
                "locator-mode"
            );

            instructionTitle.textContent =
                title;

            instructionText.textContent =
                detail;

            targetFieldValue.textContent =
                "Invalid";

            targetFieldValue.className =
                "value error";

            recordIdValue.textContent =
                recordId
                    ? String(recordId)
                    : "Missing";

            recordIdValue.className =
                "value error";

            setStatus(
                "ไม่สามารถเริ่ม Scanner ได้",
                "error"
            );

            resetButton.classList.add(
                "hidden"
            );
        }

        /*
         * =====================================================
         * PAGE CONFIGURATION
         * =====================================================
         */

        function configurePage() {
            if (!validateParameters()) {
                return false;
            }

            document.title =
                targetConfiguration
                    .pageTitle +
                " | HE SMART SCANNER";

            modeBadge.textContent =
                targetConfiguration
                    .badgeText;

            modeBadge.className =
                "mode-badge";

            if (
                targetConfiguration
                    .badgeClass
            ) {
                modeBadge.classList.add(
                    targetConfiguration
                        .badgeClass
                );
            }

            instructionTitle.textContent =
                targetConfiguration
                    .instructionTitle;

            instructionText.textContent =
                targetConfiguration
                    .instructionText;

            targetFieldValue.textContent =
                targetConfiguration
                    .targetField;

            targetFieldValue.className =
                "value";

            recordIdValue.textContent =
                String(recordId);

            recordIdValue.className =
                "value";

            technicalTarget.textContent =
                "Target: " +
                scanTarget;

            technicalField.textContent =
                "Field: " +
                targetConfiguration
                    .targetField;

            technicalModel.textContent =
                "Model: " +
                modelName;

            technicalRecord.textContent =
                "Record ID: " +
                recordId;

            setStatus(
                "กรุณาจัด QR Code ให้อยู่ภายในกรอบสแกน",
                "waiting"
            );

            return true;
        }

        /*
         * =====================================================
         * SCANNER INITIALIZATION
         * =====================================================
         */

        async function initializeScanner() {
            const isPageValid =
                configurePage();

            if (!isPageValid) {
                return;
            }

            if (
                typeof Html5Qrcode ===
                "undefined"
            ) {
                setStatus(
                    "โหลด QR Scanner Library ไม่สำเร็จ",
                    "error"
                );

                return;
            }

            html5Qrcode =
                new Html5Qrcode(
                    "reader"
                );

            await startScanner();
        }

        async function startScanner() {
            if (!html5Qrcode) {
                return;
            }

            if (scannerRunning) {
                return;
            }

            clearCountdownTimer();

            scanLocked = false;
            submissionCompleted = false;
            submissionInProgress = false;
            scannedValue = "";

            scannedValueElement.textContent =
                "รอสแกน...";

            scannedValueElement.className =
                "value waiting";

            scanAgainButton.disabled =
                false;

            resetButton.disabled =
                false;

            scanAgainButton.classList.add(
                "hidden"
            );

            closeButton.classList.add(
                "hidden"
            );

            resetButton.classList.remove(
                "hidden"
            );

            setStatus(
                "กรุณาจัด QR Code ให้อยู่ภายในกรอบสแกน",
                "waiting"
            );

            try {
                await html5Qrcode.start(
                    {
                        facingMode:
                            "environment"
                    },
                    {
                        fps: 10,

                        qrbox: {
                            width: 250,
                            height: 250
                        },

                        aspectRatio: 1
                    },
                    handleScanSuccess,
                    handleScanFailure
                );

                scannerRunning = true;

            } catch (error) {
                scannerRunning = false;

                console.error(
                    "Camera start error:",
                    error
                );

                setStatus(
                    "ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การใช้กล้อง",
                    "error"
                );

                resetButton.classList.remove(
                    "hidden"
                );
            }
        }

        async function stopScanner() {
            if (
                !html5Qrcode ||
                !scannerRunning
            ) {
                return;
            }

            try {
                await html5Qrcode.stop();

            } catch (error) {
                console.warn(
                    "Scanner stop warning:",
                    error
                );

            } finally {
                scannerRunning = false;
            }
        }

        /*
         * =====================================================
         * QR SCAN RESULT
         * =====================================================
         */

        async function handleScanSuccess(
            decodedText,
            decodedResult
        ) {
            /*
             * ป้องกันการอ่าน QR เดิมซ้ำ
             */
            if (scanLocked) {
                return;
            }

            const cleanedValue =
                String(
                    decodedText || ""
                ).trim();

            if (!cleanedValue) {
                setStatus(
                    "QR Code ไม่มีข้อมูล กรุณาสแกนใหม่",
                    "error"
                );

                return;
            }

            scanLocked = true;
            scannedValue =
                cleanedValue;

            scannedValueElement.textContent =
                scannedValue;

            scannedValueElement.className =
                "value";

            /*
             * หยุดกล้องทันทีเมื่ออ่านสำเร็จ
             */
            await stopScanner();

            setStatus(
                targetConfiguration
                    .sendingText,
                "processing"
            );

            /*
             * ซ่อนปุ่มทั้งหมดระหว่างส่งข้อมูล
             */
            scanAgainButton.classList.add(
                "hidden"
            );

            closeButton.classList.add(
                "hidden"
            );

            resetButton.classList.add(
                "hidden"
            );

            /*
             * ส่งข้อมูลทันที ไม่ต้องกดยืนยัน
             */
            await sendTargetValueToOdoo();
        }

        function handleScanFailure(
            errorMessage
        ) {
            /*
             * html5-qrcode จะเรียกฟังก์ชันนี้
             * ต่อเนื่องเมื่อยังอ่าน QR ไม่สำเร็จ
             * จึงไม่แสดง Error ทุกครั้ง
             */
        }

        /*
         * =====================================================
         * WEBHOOK PAYLOAD
         * =====================================================
         */

        function createOdooPayload() {
            return {
                record_id:
                    recordId,

                model:
                    modelName,

                target:
                    scanTarget,

                field_name:
                    targetConfiguration
                        .targetField,

                value:
                    scannedValue
            };
        }

        /*
         * =====================================================
         * AUTO SEND TO ODOO
         * =====================================================
         */

        async function sendTargetValueToOdoo() {
            /*
             * ป้องกันการส่งซ้ำ
             */
            if (submissionInProgress) {
                return;
            }

            if (!scannedValue) {
                setStatus(
                    "ยังไม่มีข้อมูล QR สำหรับบันทึก",
                    "error"
                );

                showRetryButtons();
                return;
            }

            submissionInProgress = true;

            const payload =
                createOdooPayload();

            console.log(
                "Odoo Webhook Payload:",
                JSON.stringify(
                    payload,
                    null,
                    2
                )
            );

            try {
                /*
                 * ใช้ no-cors สำหรับ Odoo Webhook
                 * Content-Type text/plain ลดการเกิด CORS preflight
                 */
                await fetch(
                    ODOO_WEBHOOK_URL,
                    {
                        method:
                            "POST",

                        mode:
                            "no-cors",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=UTF-8"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

                submissionCompleted =
                    true;

                /*
                 * ส่งสำเร็จในระดับ Browser
                 * เริ่มนับถอยหลังรอ Odoo ประมวลผล
                 */
                startReturnCountdown();

            } catch (error) {
                submissionCompleted =
                    false;

                submissionInProgress =
                    false;

                console.error(
                    "Odoo Webhook Error:",
                    error
                );

                setStatus(
                    "ไม่สามารถส่งข้อมูลเข้า Odoo ได้ กรุณาสแกนใหม่",
                    "error"
                );

                showRetryButtons();
            }
        }

        /*
         * =====================================================
         * COUNTDOWN AND AUTO RETURN
         * =====================================================
         */

        function startReturnCountdown() {
            let remainingSeconds =
                Math.ceil(
                    WEBHOOK_WAIT_TIME_MS /
                    1000
                );

            const scanLabel =
                scanTarget === "material"
                    ? "Material QR"
                    : "Locator QR";

            function updateCountdownMessage() {
                setStatus(
                    targetConfiguration
                        .successText +
                    " กำลังกลับหน้า Odoo ใน " +
                    remainingSeconds +
                    " วินาที",
                    "success"
                );
            }

            updateCountdownMessage();

            countdownTimer =
                window.setInterval(
                    function () {
                        remainingSeconds -= 1;

                        if (
                            remainingSeconds > 0
                        ) {
                            updateCountdownMessage();
                            return;
                        }

                        clearCountdownTimer();

                        setStatus(
                            "กำลังโหลดข้อมูลล่าสุดจาก Odoo",
                            "success"
                        );

                        reloadOdooRecord();
                    },
                    1000
                );
        }

        function clearCountdownTimer() {
            if (countdownTimer) {
                window.clearInterval(
                    countdownTimer
                );

                countdownTimer = null;
            }
        }

        /*
         * =====================================================
         * RETRY BUTTONS
         * =====================================================
         */

        function showRetryButtons() {
            scanAgainButton.disabled =
                false;

            resetButton.disabled =
                false;

            scanAgainButton.classList.remove(
                "hidden"
            );

            closeButton.classList.remove(
                "hidden"
            );

            resetButton.classList.remove(
                "hidden"
            );
        }

        /*
         * =====================================================
         * RELOAD ODOO RECORD
         * =====================================================
         */

        function buildOdooRecordUrl() {
            return (
                ODOO_BASE_URL +
                "/odoo/action-" +
                ODOO_ACTION_ID +
                "/" +
                recordId +
                "?qr_refresh=" +
                Date.now()
            );
        }

        function reloadOdooRecord() {
            const reloadUrl =
                buildOdooRecordUrl();

            console.log(
                "Reloading Odoo record:",
                reloadUrl
            );

            /*
             * replace ป้องกันการย้อนกลับ
             * มาหน้า Scanner ที่ส่งรายการแล้ว
             */
            window.location.replace(
                reloadUrl
            );
        }

        function returnToOdoo() {
            reloadOdooRecord();
        }

        /*
         * =====================================================
         * RESET SCANNER
         * =====================================================
         */

        async function resetScanner() {
            clearCountdownTimer();

            await stopScanner();

            scanLocked = false;
            submissionCompleted = false;
            submissionInProgress = false;
            scannedValue = "";

            scannedValueElement.textContent =
                "รอสแกน...";

            scannedValueElement.className =
                "value waiting";

            scanAgainButton.disabled =
                false;

            resetButton.disabled =
                false;

            scanAgainButton.classList.add(
                "hidden"
            );

            closeButton.classList.add(
                "hidden"
            );

            resetButton.classList.remove(
                "hidden"
            );

            await startScanner();
        }

        /*
         * =====================================================
         * STATUS DISPLAY
         * =====================================================
         */

        function setStatus(
            message,
            type
        ) {
            statusText.textContent =
                message;

            statusText.className =
                "status-message";

            if (
                type === "processing"
            ) {
                statusText.classList.add(
                    "processing"
                );
            }

            if (
                type === "success"
            ) {
                statusText.classList.add(
                    "success"
                );
            }

            if (
                type === "error"
            ) {
                statusText.classList.add(
                    "error"
                );
            }
        }

        /*
         * =====================================================
         * BUTTON EVENTS
         * =====================================================
         */

        scanAgainButton.addEventListener(
            "click",
            resetScanner
        );

        resetButton.addEventListener(
            "click",
            resetScanner
        );

        closeButton.addEventListener(
            "click",
            returnToOdoo
        );

        /*
         * =====================================================
         * PAGE EVENTS
         * =====================================================
         */

        window.addEventListener(
            "pagehide",
            function () {
                clearCountdownTimer();
                stopScanner();
            }
        );

        window.addEventListener(
            "beforeunload",
            function () {
                clearCountdownTimer();
                stopScanner();
            }
        );

        window.addEventListener(
            "load",
            initializeScanner
        );
    </script>

</body>
</html>
